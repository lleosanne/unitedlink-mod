name: Build UnitedLink Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build mod jar
        run: gradle build

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitedlink-mod
          path: build/libs/unitedlink-*.jar
          if-no-files-found: error
